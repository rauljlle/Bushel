[package]
name = "container-compose"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Compose plugin for Apple's container CLI"

[[bin]]
name = "compose"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "=4.5.20", features = ["derive"] }
indexmap = { version = "=2.7.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
shell-words = "1.1"
